<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>良聯｜工程管理平台 - 登入</title>
    <link rel="shortcut icon" href="assets/images/favicons/favicon.ico" type="image/x-icon">
    <!-- 引用本地 Bootstrap CSS -->
    <link href="../../assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引用本地 Font Awesome CSS -->
    <link href="../../assets/css/all.min.css" rel="stylesheet">
    <!-- 母版樣式 -->
    <link href="../../assets/css/master_style.css" rel="stylesheet">
    <style>
        :root {
            --ll-primary: #1e40af;
            --ll-secondary: #1e3a8a;
            --ll-accent: #3b82f6;
            --ll-light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Three.js 背景容器 */
        #threejs-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #threejs-background canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* 載入畫面 */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--ll-primary) 0%, var(--ll-secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        .spinner-ring:nth-child(2) {
            border-top-color: #60a5fa;
            animation-duration: 2s;
        }

        .spinner-ring:nth-child(3) {
            border-top-color: #93c5fd;
            animation-duration: 2.5s;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1rem;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* 主登入容器 */
        .login-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            box-shadow: 
                0 25px 70px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 580px;
            margin: 2rem;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 登入標題區域 */
        .login-header {
            background: linear-gradient(135deg, 
                rgba(30, 64, 175, 0.95) 0%, 
                rgba(30, 58, 138, 0.95) 100%
            );
            color: white;
            padding: 1.5rem 2rem;
            text-align: center;
            position: relative;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 20px solid rgba(30, 58, 138, 0.95);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .company-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto;
            overflow: hidden;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .company-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .system-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin: 0;
        }

        /* 登入表單區域 */
        .login-form {
            padding: 2rem;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
        }

        .welcome-text {
            text-align: center;
            color: #1e293b;
            margin-bottom: 2rem;
            font-size: 1rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.75rem;
            display: block;
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            z-index: 5;
            transition: color 0.3s ease;
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.25rem 1rem 3rem;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            color: #1e293b;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--ll-accent);
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .form-control:focus + .input-icon {
            color: var(--ll-accent);
        }

        .password-toggle {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            z-index: 5;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .password-toggle:hover {
            color: var(--ll-accent);
            transform: translateY(-50%) scale(1.1);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.5rem 0;
        }

        .form-check {
            display: flex;
            align-items: center;
        }

        .form-check-input {
            width: 18px;
            height: 18px;
            margin-right: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .form-check-label {
            font-size: 0.9rem;
            color: #475569;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--ll-accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .forgot-password:hover {
            text-decoration: underline;
            color: #60a5fa;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--ll-accent), var(--ll-primary));
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.5);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-spinner {
            display: none;
            margin-right: 0.5rem;
            animation: spin 1s linear infinite;
        }

        .login-btn.loading .btn-spinner {
            display: inline-block;
        }

        /* 底部資訊 */
        .login-footer {
            text-align: center;
            padding: 1.5rem 2.5rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .system-info {
            font-size: 0.85rem;
            color: #616161;
            line-height: 1.6;
        }

        /* 錯誤訊息 */
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .error-message.show {
            display: flex;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .login-container {
                margin: 1rem;
                max-width: calc(100% - 2rem);
            }

            .login-header {
                padding: 2rem 1.5rem;
            }

            .login-form {
                padding: 2rem 1.5rem;
            }

            .system-title {
                font-size: 1.5rem;
            }

            .company-logo {
                width: 100px;
                height: 100px;
            }

            .remember-forgot {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- 載入畫面 -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner">
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
                <div class="spinner-ring"></div>
            </div>
            <p class="loading-text">系統載入中...</p>
        </div>
    </div>

    <!-- Three.js 背景容器 -->
    <div id="threejs-background"></div>

    <!-- 主登入容器 -->
    <div class="login-container">
        <!-- 登入標題區域 -->
        <div class="login-header">
            <div class="company-logo">
                <img src="assets/images/LL-logo.jpg" alt="良聯工業">
            </div>
            <h1 class="system-title">良聯｜工程管理平台</h1>
        </div>

        <!-- 登入表單 -->
        <form class="login-form" id="loginForm">
            <p class="welcome-text">歡迎使用本平台,請登入您的帳號</p>

            <!-- 錯誤訊息 -->
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span id="errorText">帳號或密碼錯誤,請重新輸入</span>
            </div>

            <!-- 帳號欄位 -->
            <div class="form-group">
                <label for="username" class="form-label">帳號</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" 
                           class="form-control" 
                           id="username" 
                           placeholder="請輸入帳號"
                           required
                           autocomplete="username">
                </div>
            </div>

            <!-- 密碼欄位 -->
            <div class="form-group">
                <label for="password" class="form-label">密碼</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" 
                           class="form-control" 
                           id="password" 
                           placeholder="請輸入密碼"
                           required
                           autocomplete="current-password">
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye-slash" id="passwordIcon"></i>
                    </button>
                </div>
            </div>

            <!-- 記住我和忘記密碼 -->
            <div class="remember-forgot">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">記住我</label>
                </div>
                <a href="#" class="forgot-password" onclick="showForgotPassword(); return false;">忘記密碼?</a>
            </div>

            <!-- 登入按鈕 -->
            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-spinner btn-spinner"></i>
                <span id="loginBtnText">登入系統</span>
            </button>
        </form>

        <!-- 底部資訊 -->
        <div class="login-footer">
            <div class="system-info">
                本網站最佳瀏覽環境為 1920 x 1080<br>
                請使用最新版本的 Edge 瀏覽器以獲得最佳體驗
            </div>
        </div>
    </div>
    
    <!-- 母版 JavaScript -->
    <script src="../../../assets/js/master_script.js"></script>
    <!-- three 3D bg JavaScript -->
    <script src="../../../assets/js/three.min.js"></script>

    <script>
        // Three.js 工程網格背景
        let scene, camera, renderer, mesh, particles;
        let animationId;
        let isAnimating = true;
        let animationSpeed = 1;

        function initThreeJS() {
            const container = document.getElementById('threejs-background');
            
            // 創建場景
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0a1628, 1, 1000);
            
            // 創建相機
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;
            camera.position.y = 10;
            camera.lookAt(0, 0, 0);
            
            // 創建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x0a1628, 1);
            container.appendChild(renderer.domElement);
            
            // 創建波動網格
            const geometry = new THREE.PlaneGeometry(100, 100, 50, 50);
            const material = new THREE.MeshBasicMaterial({
                color: 0x1e40af,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 3;
            scene.add(mesh);
            
            // 創建粒子系統
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 1000;
            const posArray = new Float32Array(particlesCount * 3);
            
            for(let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 100;
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.3,
                color: 0x3b82f6,
                transparent: true,
                opacity: 0.6
            });
            
            particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);
            
            // 添加環境光
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            // 添加點光源
            const pointLight = new THREE.PointLight(0x3b82f6, 1, 100);
            pointLight.position.set(0, 20, 20);
            scene.add(pointLight);
            
            animate();
            
            // 隱藏載入畫面
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 1500);
        }
        
        function animate() {
            if (!isAnimating) return;
            
            animationId = requestAnimationFrame(animate);
            
            const time = Date.now() * 0.0005 * animationSpeed;
            
            // 波動網格效果
            const positions = mesh.geometry.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const y = positions.getY(i);
                const z = Math.sin(x * 0.1 + time) * Math.cos(y * 0.1 + time) * 2;
                positions.setZ(i, z);
            }
            positions.needsUpdate = true;
            
            // 旋轉網格
            mesh.rotation.z = time * 0.1;
            
            // 粒子動畫
            particles.rotation.y = time * 0.05;
            particles.rotation.x = time * 0.03;
            
            renderer.render(scene, camera);
        }
        
        // 響應式處理
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 密碼顯示/隱藏
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fas fa-eye';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fas fa-eye-slash';
            }
        }
        
        // 忘記密碼
        function showForgotPassword() {
            alert('請聯絡系統管理員重設密碼');
        }
        
        // 登入表單處理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');
            
            // 顯示載入狀態
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            
            // 模擬登入驗證
            setTimeout(() => {
                if (username === 'test' && password === '123') {
                    // 儲存登入狀態
                    if (rememberMe) {
                        localStorage.setItem('username', username);
                        localStorage.setItem('rememberMe', 'true');
                    }
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('currentUser', username);
                    
                    // 跳轉到首頁
                    window.location.href = 'core/home/index.html';
                } else {
                    // 顯示錯誤訊息
                    const errorMessage = document.getElementById('errorMessage');
                    errorMessage.classList.add('show');
                    
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                    
                    setTimeout(() => {
                        errorMessage.classList.remove('show');
                    }, 3000);
                }
            }, 1000);
        });
        
        // 檢查是否記住帳號
        window.addEventListener('DOMContentLoaded', function() {
            const rememberMe = localStorage.getItem('rememberMe');
            const savedUsername = localStorage.getItem('username');
            
            if (rememberMe === 'true' && savedUsername) {
                document.getElementById('username').value = savedUsername;
                document.getElementById('rememberMe').checked = true;
            }
            
            // 初始化 Three.js
            initThreeJS();
        });
    </script>
</body>
</html>
