<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>良聯｜工程估算</title>
    <script>
        // 設定全域變數以供 layout_loader.js 使用
        window.ASSETS_PATH = '../../../'; 
        window.SIDEBAR_TYPE = 'project';  
        
        window.BREADCRUMBS = [
            { name: '報價估算系統', link: '' },
            { name: '專案列表', link: '../project-list/index.html' },
            { name: '專案儀表板', link: '../project-dashboard/index.html' },
            { name: '工程估算', link: '' }
        ];
    </script>
    <link rel="shortcut icon" href="../../../assets/images/favicons/favicon.ico" type="image/x-icon">
    <link href="../../../assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../../assets/css/all.min.css" rel="stylesheet">
    <link href="../../../assets/css/master_style.css" rel="stylesheet">
    <link href="../../../modules/quotation/cost-estimation/estimation.css" rel="stylesheet">
</head>
<body>
    <!-- 側邊欄佔位符 -->
    <div id="sidebar-placeholder"></div>

    <div class="main-content" id="mainContent">
        <!-- 頂部導航佔位符 -->
        <div id="header-placeholder"></div>

        <div class="container-fluid" style="padding: 2rem;">
            
            <!-- 1. 專案標題區域 -->
            <div class="project-header mb-4">
                <div class="project-status" id="headerStatus">載入中...</div>
                
                <div class="d-flex align-items-center gap-3 mb-2">
                    <h1 class="project-title mb-0" id="headerTitle">載入中...</h1>
                </div>
                
                <div class="project-meta">
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-file-invoice"></i></div>
                        <div>
                            <small style="opacity: 0.6;">報價編號</small>
                            <div class="fw-bold" id="headerQuotationId">-</div>
                        </div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-hashtag"></i></div>
                        <div>
                            <small style="opacity: 0.6;">專案編號</small>
                            <div class="fw-bold" id="headerProjectId">-</div>
                        </div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-user-tie"></i></div>
                        <div>
                            <small style="opacity: 0.6;">業主名稱</small>
                            <div class="fw-bold" id="headerOwner">-</div>
                        </div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-building"></i></div>
                        <div>
                            <small style="opacity: 0.6;">客戶名稱</small>
                            <div class="fw-bold" id="headerCustomer">-</div>
                        </div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-calendar"></i></div>
                        <div>
                            <small style="opacity: 0.6;">投標日期</small>
                            <div class="fw-bold" id="headerBidDate">-</div>
                        </div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-sack-dollar"></i></div>
                        <div>
                            <small style="opacity: 0.6;">工程估算總價</small>
                            <div class="fw-bold text-warning" id="headerTotalCost" style="font-size: 1.2rem;">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. 操作工具列 -->
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">
                
                <div class="d-flex align-items-center gap-3">
                    <h5 class="mb-0 text-primary fw-bold">
                        <i class="fas fa-tools me-2"></i>工程估算列表
                    </h5>
                    <!-- 批次操作區塊 -->
                    <div id="batchActionArea" class="d-flex align-items-center gap-2" style="opacity: 0; pointer-events: none; transition: opacity 0.3s;">
                        <span class="badge bg-secondary" id="selectedCountBadge">已選 0 項</span>
                        <button class="btn btn-primary" onclick="openChangeAssigneeModal()">
                            <i class="fas fa-user-edit me-1"></i>批次變更人員
                        </button>
                    </div>
                </div>
            </div>

            <!-- 3. 估算項目列表 -->
            <div class="content-card">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table estimation-table table-hover mb-0">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th style="width: 40px; text-align: center;">
                                        <input type="checkbox" class="form-check-input" id="selectAllBtn" onchange="toggleSelectAll(this)">
                                    </th>
                                    <th style="width: 60px; text-align: center;">項次</th>
                                    <th style="min-width: 200px;">工程項目名稱</th>
                                    <th style="width: 150px;">施工地點</th>
                                    <th style="width: 120px; text-align: center;">執行單位</th>
                                    <th style="width: 140px;">估算人員</th>
                                    <th style="width: 120px;">應完成日</th>
                                    <th style="width: 150px; text-align: right; display: none;">估算金額 (NT$)</th>
                                    <th style="width: 100px; text-align: center;">狀態</th>
                                </tr>
                            </thead>
                            <tbody id="engineeringTableBody">
                                <!-- 內容由 JS 動態產生 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 變更估算人員 Modal -->
    <div class="modal fade" id="changeAssigneeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fas fa-user-edit me-2"></i>指派工程估算人員</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info py-2 mb-3">
                        <i class="fas fa-info-circle me-2"></i><span id="selectedItemsCount">已選擇 0 個項目</span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">指派新的人員 (建造部)</label>
                        <select class="form-select" id="newAssigneeSelect">
                            <option value="陳建國">陳建國</option>
                            <option value="林工程">林工程</option>
                            <option value="黃專案">黃專案</option>
                            <option value="待指派">待指派</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="confirmChangeAssignee()">確認指派</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 腳本引入 (完全比照成本估算載入專案母版依賴) -->
    <script src="../../../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/path_config.js"></script>
    <script src="../../../assets/js/master_script.js"></script>
    <script src="../../../assets/js/layout_loader.js"></script>
    <!-- 工程估算專屬 JavaScript -->
    <script src="eng_estimation.js"></script>
</body>
</html>
