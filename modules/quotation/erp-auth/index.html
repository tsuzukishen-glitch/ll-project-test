<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>良聯｜報價授權單</title>
    <script>
        window.ASSETS_PATH = '../../../'; 
        window.SIDEBAR_TYPE = 'project';  
        
        window.BREADCRUMBS = [
            { name: '報價估算系統', link: '' },
            { name: '專案列表', link: '../project-list/index.html' },
            { name: '專案儀表板', link: '../project-dashboard/index.html' },
            { name: '報價授權單', link: '' }
        ];
    </script>
    <link rel="shortcut icon" href="../../../assets/images/favicons/favicon.ico" type="image/x-icon">
    <!-- 引用本地 Bootstrap CSS -->
    <link href="../../../assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引用本地 Font Awesome CSS -->
    <link href="../../../assets/css/all.min.css" rel="stylesheet">
    <!-- 母版樣式 -->
    <link href="../../../assets/css/master_style.css" rel="stylesheet">
    <!-- 報價授權單樣式 -->
    <link href="auth.css" rel="stylesheet">
</head>
<body>
    <div id="sidebar-placeholder"></div>

    <div class="main-content" id="mainContent">
        <div id="header-placeholder"></div>

        <div class="container-fluid" style="padding: 2rem;">
            
            <!-- 1. 專案標題區域 (繼承儀表板樣式) -->
            <div class="project-header">
                <!-- 狀態標籤 -->
                <div class="project-status" id="headerStatus">載入中...</div>
                
                <div class="d-flex align-items-center gap-3 mb-2">
                    <h1 class="project-title mb-0" id="headerTitle">載入中...</h1>
                </div>
                
                <div class="project-meta">
                    <!-- 1. 報價編號 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-file-invoice"></i></div>
                        <div>
                            <small style="opacity: 0.6;">報價編號</small>
                            <div class="fw-bold" id="headerQuotationId">-</div>
                        </div>
                    </div>
                    <!-- 2. 專案編號 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-hashtag"></i></div>
                        <div>
                            <small style="opacity: 0.6;">專案編號</small>
                            <div class="fw-bold" id="headerProjectId">-</div>
                        </div>
                    </div>
                    <!-- 3. 業主名稱 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-user-tie"></i></div>
                        <div>
                            <small style="opacity: 0.6;">業主名稱</small>
                            <div class="fw-bold" id="headerOwner">-</div>
                        </div>
                    </div>
                    <!-- 4. 客戶名稱 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-building"></i></div>
                        <div>
                            <small style="opacity: 0.6;">客戶名稱</small>
                            <div class="fw-bold" id="headerCustomer">-</div>
                        </div>
                    </div>
                    <!-- 5. 投標日期 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-calendar"></i></div>
                        <div>
                            <small style="opacity: 0.6;">投標日期</small>
                            <div class="fw-bold" id="headerBidDate">-</div>
                        </div>
                    </div>
                    <!-- 6. 投標剩餘天數 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-clock"></i></div>
                        <div>
                            <small style="opacity: 0.6;">投標剩餘天數</small>
                            <div class="fw-bold" id="headerRemainingDays">-</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. 操作工具列 -->
            <div class="d-flex justify-content-between align-items-center mb-4 gap-3">
                <h5 class="mb-0 text-primary fw-bold"><i class="fas fa-info-circle me-2"></i>ERP 報價授權單資料</h5>
                <div>
                    <span class="text-muted me-3" id="lastSyncTime">最後同步：--</span>
                    <button class="btn btn-primary" id="btnSync" onclick="syncERPAuth()">
                        <i class="fas fa-sync-alt me-2"></i>更新 ERP 狀態
                    </button>
                </div>
            </div>

            <!-- 3. 詳細資料表單 -->
            <div class="row">
                <div class="col-12">
                    <div class="auth-form-card">
                        <div class="card-body">
                            <!-- 區塊一：專案基本資料 -->
                            <div class="section-divider">
                                <div class="section-title"><i class="fas fa-clipboard-list"></i> 專案基本資料</div>
                            </div>
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">報價編號</label>
                                        <input type="text" class="form-control-plaintext fw-bold text-primary" id="fieldQuotationNo" readonly>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">業主名稱</label>
                                        <input type="text" class="form-control-plaintext" id="fieldOwner" readonly>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">客戶名稱</label>
                                        <input type="text" class="form-control-plaintext" id="fieldCustomer" readonly>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">投標日期</label>
                                        <input type="text" class="form-control-plaintext text-danger fw-bold" id="fieldBidDate" readonly>
                                    </div>
                                </div>
                                <div class="col-9">
                                    <div class="form-group">
                                        <label class="form-label">工程名稱</label>
                                        <input type="text" class="form-control-plaintext fw-bold" id="fieldProjectTitle" readonly>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">專案編號(得標後產生)</label>
                                        <input type="text" class="form-control-plaintext" id="fieldProjectNo" readonly>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-group">
                                        <label class="form-label">工作範圍</label>
                                        <div class="form-control-plaintext multiline" id="fieldScope"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 區塊二：重要日程 -->
                            <div class="section-divider">
                                <div class="section-title"><i class="fas fa-calendar-alt"></i> 重要日程</div>
                            </div>
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">專案期間(起)</label>
                                        <input type="text" class="form-control-plaintext" id="fieldProjStart" readonly>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">專案期間(迄)</label>
                                        <input type="text" class="form-control-plaintext" id="fieldProjEnd" readonly>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">收到詢價日期</label>
                                        <input type="text" class="form-control-plaintext" id="fieldInquiryDate" readonly>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">業主要求報價日期</label>
                                        <input type="text" class="form-control-plaintext" id="fieldCustomerReqDate" readonly>
                                    </div>
                                </div>
                            </div>

                            <!-- 區塊三：報價負責人 -->
                            <div class="section-divider">
                                <div class="section-title"><i class="fas fa-user-tie"></i> 報價負責人</div>
                            </div>
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">報價經理</label>
                                        <input type="text" class="form-control-plaintext" id="fieldManager" readonly>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">部門</label>
                                        <input type="text" class="form-control-plaintext" id="fieldDept" readonly>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label class="form-label">職稱</label>
                                        <input type="text" class="form-control-plaintext" id="fieldTitle" readonly>
                                    </div>
                                </div>
                            </div>

                            <!-- 區塊四：支援部門與工時分配 -->
                            <div class="section-divider">
                                <div class="section-title"><i class="fas fa-users-cog"></i> 支援部門與工時分配</div>
                            </div>
                            <div class="row">
                                <div class="col-12">
                                    <!-- 修改為自定義表格容器 -->
                                    <div class="custom-table-container">
                                        <table class="table custom-table">
                                            <thead>
                                                <tr>
                                                    <th style="width: 20%">支援部門</th>
                                                    <th style="width: 15%">工號</th>
                                                    <th style="width: 15%">姓名</th>
                                                    <th style="width: 25%">需完成日</th>
                                                    <th style="width: 25%">報價工時(H)</th>
                                                </tr>
                                            </thead>
                                            <tbody id="supportDeptTableBody">
                                                <!-- JS 動態生成內容 -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="../../../assets/js/bootstrap.bundle.min.js"></script>
    <!-- 路徑配置工具 -->
    <script src="../../../assets/js/path_config.js"></script>
    <!-- 母版 JavaScript -->
    <script src="../../../assets/js/master_script.js"></script>
    <!-- 側邊欄+頂部導航 JavaScript -->
    <script src="../../../assets/js/layout_loader.js"></script>
    <!-- 報價授權單 JavaScript -->
    <script src="auth.js"></script>
</body>
</html>
