<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>良聯｜邀標單資料</title>
    <script>
        window.ASSETS_PATH = '../../../'; 
        window.SIDEBAR_TYPE = 'project';  
        
        window.BREADCRUMBS = [
            { name: '報價估算系統', link: '' },
            { name: '專案列表', link: '../project-list/index.html' },
            { name: '專案儀表板', link: '../project-dashboard/index.html' },
            { name: '邀標單資料', link: '' }
        ];
    </script>
    <link rel="shortcut icon" href="../../../assets/images/favicons/favicon.ico" type="image/x-icon">
    <!-- Google Fonts - 思源黑體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引用本地 Bootstrap CSS -->
    <link href="../../../assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引用本地 Font Awesome CSS -->
    <link href="../../../assets/css/all.min.css" rel="stylesheet">
    <!-- 母版樣式 -->
    <link href="../../../assets/css/master_style.css" rel="stylesheet">
    <!-- 邀標單資料樣式 -->
    <link href="data.css" rel="stylesheet">
</head>
<body>
    <div id="sidebar-placeholder"></div>

    <div class="main-content" id="mainContent">
        <div id="header-placeholder"></div>

        <div class="container-fluid" style="padding: 2rem;">
            
            <!-- 1. 專案標題區域 -->
            <div class="project-header">
                <!-- 狀態標籤 -->
                <div class="project-status" id="headerStatus">載入中...</div>
                
                <div class="d-flex align-items-center gap-3 mb-2">
                    <h1 class="project-title mb-0" id="headerTitle">載入中...</h1>
                </div>
                <p class="mb-0" id="headerDesc">...</p>
                
                <div class="project-meta">
                    <!-- 1. 報價編號 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-file-invoice"></i></div>
                        <div>
                            <small style="opacity: 0.6;">報價編號</small>
                            <div class="fw-bold" id="headerQuotationId">-</div>
                        </div>
                    </div>
                    <!-- 2. 專案編號 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-hashtag"></i></div>
                        <div>
                            <small style="opacity: 0.6;">專案編號</small>
                            <div class="fw-bold" id="headerProjectId">-</div>
                        </div>
                    </div>
                    <!-- 3. 業主名稱 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-user-tie"></i></div>
                        <div>
                            <small style="opacity: 0.6;">業主名稱</small>
                            <div class="fw-bold" id="headerOwner">-</div>
                        </div>
                    </div>
                    <!-- 4. 客戶名稱 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-building"></i></div>
                        <div>
                            <small style="opacity: 0.6;">客戶名稱</small>
                            <div class="fw-bold" id="headerCustomer">-</div>
                        </div>
                    </div>
                    <!-- 5. 投標日期 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-calendar"></i></div>
                        <div>
                            <small style="opacity: 0.6;">投標日期</small>
                            <div class="fw-bold" id="headerBidDate">-</div>
                        </div>
                    </div>
                    <!-- 6. 投標剩餘天數 -->
                    <div class="meta-item">
                        <div class="meta-icon"><i class="fas fa-clock"></i></div>
                        <div>
                            <small style="opacity: 0.6;">投標剩餘天數</small>
                            <div class="fw-bold" id="headerRemainingDays">-</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. 操作工具列 -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <h5 class="mb-0 text-primary fw-bold">
                    <i class="fas fa-tasks me-2"></i>邀標單作業
                </h5>

                <div class="d-flex gap-2 align-items-center">
                    <button class="btn btn-outline-primary" onclick="downloadTemplate()">
                        <i class="fas fa-download me-2"></i>下載標單模板
                    </button>
                    
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-file-excel me-2"></i>上傳標單
                    </button>
                    
                    <!-- 按需求 1 修改文字 -->
                    <button class="btn btn-outline-info" onclick="openTemplateModal()">
                        <i class="fas fa-puzzle-piece me-2"></i>加入範本
                    </button>
                    <button class="btn btn-outline-secondary" onclick="openHistoryModal()">
                        <i class="fas fa-history me-2"></i>加入歷史標單
                    </button>

                    <div class="vr mx-1"></div>
                    
                    <button class="btn btn-outline-secondary" onclick="saveProgress()">
                        <i class="fas fa-save me-2"></i>暫存
                    </button>
                    <button class="btn btn-success" onclick="completeAssignment()">
                        <i class="fas fa-check-circle me-2"></i>設定完成並分派
                    </button>
                    
                    <input type="file" id="fileInput" hidden accept=".xlsx, .xls, .csv" onchange="handleFileUpload(this)">
                </div>
            </div>

            <div class="row">
                <!-- 左側：檔案列表 -->
                <div class="col-lg-3">
                    <div class="content-card h-100">
                        <div class="card-header">
                            <i class="fas fa-folder-open me-2"></i>標單文件列表
                        </div>
                        <div class="card-body p-0">
                            <div class="file-list" id="fileList">
                                <!-- 檔案列表由 JS 生成 -->
                                <div class="empty-state-small">
                                    <i class="fas fa-cloud-upload-alt mb-2"></i>
                                    <p>尚未上傳或匯入任何文件</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右側：標單內容與指派 -->
                <div class="col-lg-9">
                    <div class="content-card assignment-panel">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span><i class="fas fa-list-ol me-2"></i>標單項目指派</span>
                            <span class="badge bg-info text-white" id="itemCount">共 0 項</span>
                        </div>
                        <div class="card-body p-0">
                            <div class="assignment-scroll-container">
                                <div id="batchToolbar" class="batch-toolbar">
                                    <span class="batch-toolbar-text">已選取 <strong id="batchSelectedCount">0</strong> 項</span>
                                    <div class="batch-toolbar-actions">
                                        <button type="button" class="btn btn-primary btn-sm" id="batchAssignBtn" onclick="openBatchAssignDropdown(event)">
                                            <i class="fas fa-layer-group me-1"></i>批次指派執行單位
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="clearBatchSelection()">
                                            取消選取
                                        </button>
                                    </div>
                                </div>
                                <div class="table-responsive" style="overflow: visible;"> 
                                    <table class="table assignment-table mb-0">
                                        <thead>
                                            <tr>
                                                <th style="width: 36px;"></th>
                                                <th style="width: 60px;">項次</th>
                                            <th>工程內容 / 品名規格</th>
                                            <th style="width: 80px;">單位</th>
                                            <th style="width: 100px;">數量</th>
                                            <th style="width: 300px;">執行單位 (可複選)</th>
                                        </tr>
                                    </thead>
                                    <tbody id="assignmentTableBody">
                                        <tr>
                                            <td colspan="6" class="text-center py-5 text-muted">
                                                請先上傳或從範本/歷史標單匯入資料
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 加入範本 Modal (依需求修改) ==================== -->
    <div class="modal fade" id="templateModal" tabindex="-1" aria-labelledby="templateModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content" style="height: 650px;">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="templateModalLabel"><i class="fas fa-puzzle-piece me-2"></i>加入範本</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="templateSearch" placeholder="搜尋產品名稱 (例如: PC, 塔槽...)" oninput="filterTemplates()">
                    </div>
                    <!-- 表格 -->
                    <div class="table-responsive border rounded custom-modal-table-container">
                        <table class="table table-hover mb-0">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th style="width: 40px;"></th>
                                    <th>產品範本名稱</th>
                                    <th style="width: 120px;">需求組數</th>
                                </tr>
                            </thead>
                            <tbody id="templateTableBody">
                                <!-- 由 JS 動態產生 -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="confirmAddTemplates()">確認加入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 加入歷史標單 Modal ==================== -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content" style="height: 650px;">
                <div class="modal-header">
                    <h5 class="modal-title" id="historyModalLabel"><i class="fas fa-history me-2"></i>加入歷史標單</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="historySearch" placeholder="搜尋專案名稱、標單號碼..." oninput="filterHistory()">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="historyYear" onchange="filterHistory()">
                                <option value="">所有年份</option>
                                <option value="2025">2025年</option>
                                <option value="2024">2024年</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="historyCustomer" onchange="filterHistory()">
                                <option value="">所有客戶</option>
                                <option value="台積電">台積電</option>
                                <option value="鴻海">鴻海</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-responsive border rounded custom-modal-table-container">
                        <table class="table table-hover mb-0">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th style="width: 40px;"></th>
                                    <th>專案名稱</th>
                                    <th>客戶</th>
                                    <th>標單檔案名稱</th>
                                    <th>日期</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="confirmAddHistory()">確認加入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="../../../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../../../assets/js/path_config.js"></script>
    <script src="../../../assets/js/master_script.js"></script>
    <script src="../../../assets/js/layout_loader.js"></script>
    <!-- 邀標單資料 JavaScript -->
    <script src="data.js"></script>
</body>
</html>
